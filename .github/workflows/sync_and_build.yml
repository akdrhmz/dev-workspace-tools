name: Workspace Sync & Build

on:
  schedule:
    - cron: "0 */6 * * *" # Her 6 saatte bir otomatik calisir
  workflow_dispatch:      # Manuel tetikleme destegi
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Modulleri Senkronize Et
        run: |
          python generator/sync_upstream.py

      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Gradle Kur ve Calistir
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11.1"

      - name: Paketleri Derle (.cs3)
        run: |
          chmod +x ./gradlew || true
          ./gradlew make --no-daemon --stacktrace
          ./gradlew makePluginsJson --no-daemon || true

      - name: Manifest ve Dizin Olustur
        env:
          REPO_FULL: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p public
          # Tum derlenen paketleri public dizinine kopyala (public haric)
          find . -name "*.cs3" -not -path "./public/*" -exec cp {} public/ \;
          # Eger gradle makePluginsJson tarafindan uretilen plugins.json varsa al
          find . -name "plugins.json" -not -path "./public/*" -exec cp {} public/plugins.json \; 2>/dev/null || true
          # Manifest uretici
          python -c "
          import json, os, glob
          need_build = False
          if not os.path.exists('public/plugins.json') or os.path.getsize('public/plugins.json') < 10:
              need_build = True
          else:
              try:
                  with open('public/plugins.json', 'r', encoding='utf-8') as f:
                      d = json.load(f)
                      if not d:
                          need_build = True
              except Exception:
                  need_build = True

          repo_full = os.environ.get('REPO_FULL', 'akdrhmz/dev-workspace-tools')
          repo_owner = os.environ.get('REPO_OWNER', 'akdrhmz')
          repo_name = repo_full.split('/')[-1] if '/' in repo_full else 'dev-workspace-tools'
          base_url = f'https://{repo_owner}.github.io/{repo_name}'

          if need_build:
              plugins = []
              for f in glob.glob('public/*.cs3'):
                  name = os.path.basename(f).replace('.cs3', '')
                  plugins.append({
                      'name': name,
                      'url': f'{base_url}/{os.path.basename(f)}',
                      'version': 1,
                      'language': 'tr'
                  })
              with open('public/plugins.json', 'w', encoding='utf-8') as mf:
                  json.dump(plugins, mf, indent=2, ensure_ascii=False)
              print(f'[OK] Manifest olusturuldu: {len(plugins)} eklenti eklendi.')
          else:
              print('[OK] Gradle plugins.json korundu.')

          repo_meta = {
              'name': 'WatchBuddy TR Providers',
              'description': 'Universal Multi-Source Personal Provider Repository',
              'manifestVersion': 1,
              'pluginLists': [
                  f'{base_url}/plugins.json'
              ]
          }
          with open('public/repo.json', 'w', encoding='utf-8') as rf:
              json.dump(repo_meta, rf, indent=2, ensure_ascii=False)
          print('[OK] repo.json olusturuldu.')
          "

      - name: Dagitim
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
