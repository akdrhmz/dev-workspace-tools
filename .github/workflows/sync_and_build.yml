name: AtlasStream Smart Auto-Sync & Build

on:
  schedule:
    - cron: "0 */6 * * *" # Her 6 saatte bir akilli kontrol
  workflow_dispatch:      # Manuel tetikleme destegi
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Akilli Kaynak Senkronizasyonu (Sadece Degisenler)
        run: |
          python generator/sync_atlasstream.py

      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11.1"

      - name: Derleme ve Guvenlik Testi (Pre-Flight Safety Check)
        id: build_step
        run: |
          chmod +x ./gradlew || true
          # Eger upstream bozuk bir kod gonderdiyse derleme testi hata verir
          if ./gradlew make --no-daemon --stacktrace; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
            ./gradlew makePluginsJson --no-daemon || true
          else
            echo "[-] UYARI: Upstream kaynaklarindan biri hatali kod iceriyor. Degisiklikler geri aliniyor!"
            git checkout -- AtlasStream/
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
            # Son calisan stabil surumu tekrar derle
            ./gradlew make --no-daemon
            ./gradlew makePluginsJson --no-daemon || true
          fi

      - name: Basarili Guncellemeleri Master Dalina Kaydet
        if: env.BUILD_SUCCESS == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AtlasStream/
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto-sync): upstream depolarindan test edilmis akilli guncelleme [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: Manifest ve Dizin Olustur
        env:
          REPO_FULL: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          python -c "
          import json, os, glob, shutil

          os.makedirs('public', exist_ok=True)

          # 1. Derlenen .cs3 paketlerini public dizinine kopyala
          cs3_files = [f for f in glob.glob('**/*.cs3', recursive=True) if not f.startswith('public')]
          for f in cs3_files:
              dest = os.path.join('public', os.path.basename(f))
              try:
                  shutil.copy2(f, dest)
                  print(f'[+] Kopyalandi: {f} -> {dest}')
              except Exception as e:
                  print(f'[-] Kopyalama hatasi ({f}): {e}')

          # 2. Manifest ve URL yapilandirmasi (Standart builds dali formati)
          repo_full = os.environ.get('REPO_FULL', 'akdrhmz/dev-workspace-tools')
          repo_owner = os.environ.get('REPO_OWNER', 'akdrhmz')
          repo_name = repo_full.split('/')[-1] if '/' in repo_full else 'dev-workspace-tools'
          base_url = f'https://raw.githubusercontent.com/{repo_owner}/{repo_name}/builds'

          all_cs3 = glob.glob('public/*.cs3')
          plugins = []
          for f in all_cs3:
              name = os.path.basename(f).replace('.cs3', '')
              plugins.append({
                  'name': name,
                  'url': f'{base_url}/{os.path.basename(f)}',
                  'version': 3,
                  'language': 'tr'
              })

          gradle_manifest = None
          for candidate in glob.glob('**/plugins.json', recursive=True):
              if not candidate.startswith('public') and os.path.exists(candidate) and os.path.getsize(candidate) > 10:
                  try:
                      with open(candidate, 'r', encoding='utf-8') as gf:
                          content = json.load(gf)
                          if isinstance(content, list) and len(content) > 0:
                              gradle_manifest = content
                              break
                  except Exception:
                      pass

          if gradle_manifest:
              for p in gradle_manifest:
                  cs3_name = p.get('name', '') or p.get('internalName', '')
                  filename = os.path.basename(p.get('url', '')) or f'{cs3_name}.cs3'
                  p['url'] = f'{base_url}/{filename}'
              final_manifest = gradle_manifest
          else:
              final_manifest = plugins

          with open('public/plugins.json', 'w', encoding='utf-8') as mf:
              json.dump(final_manifest, mf, indent=2, ensure_ascii=False)
          print(f'[OK] plugins.json olusturuldu: {len(final_manifest)} eklenti eklendi.')

          repo_meta = {
              'name': 'AtlasStream TR Deposu',
              'description': 'AtlasStream - 40+ Entegre Kaynakli Universal Meta-Provider',
              'manifestVersion': 1,
              'pluginLists': [
                  f'{base_url}/plugins.json'
              ]
          }
          with open('public/repo.json', 'w', encoding='utf-8') as rf:
              json.dump(repo_meta, rf, indent=2, ensure_ascii=False)
          print('[OK] repo.json olusturuldu.')
          "

      - name: Dagitim (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true

      - name: Dagitim (Builds Dali)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: builds
          force_orphan: true
