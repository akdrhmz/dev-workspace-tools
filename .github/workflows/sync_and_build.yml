name: Upstream Sync & CloudStream Build

on:
  schedule:
    - cron: "0 */6 * * *" # Her 6 saatte bir otomatik calisir
  workflow_dispatch:      # Manuel tetikleme destegi
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upstream KekikStream Eklentilerini Cevir
        run: |
          python generator/sync_upstream.py

      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Gradle Kur ve Calistir
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Eklentileri Derle (.cs3 paketleri)
        run: |
          gradle makePlugins || gradle build --no-daemon

      - name: plugins.json Manifestosu ve Repo Dizini Olustur
        run: |
          mkdir -p public
          find . -name "*.cs3" -exec cp {} public/ \;
          # Manifest uretici
          python -c "
          import json, os, glob
          plugins = []
          for f in glob.glob('public/*.cs3'):
              name = os.path.basename(f).replace('.cs3', '')
              plugins.append({
                  'name': name,
                  'url': f'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/{os.path.basename(f)}',
                  'version': 1,
                  'language': 'tr'
              })
          with open('public/plugins.json', 'w', encoding='utf-8') as mf:
              json.dump(plugins, mf, indent=2, ensure_ascii=False)
          "

      - name: GitHub Pages Uzerine Dagit
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
