name: Workspace Sync & Build

on:
  schedule:
    - cron: "0 */6 * * *" # Her 6 saatte bir otomatik calisir
  workflow_dispatch:      # Manuel tetikleme destegi
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Modulleri Senkronize Et
        run: |
          python generator/sync_upstream.py

      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Gradle Kur ve Calistir
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11.1"

      - name: Paketleri Derle (.cs3)
        run: |
          chmod +x ./gradlew || true
          ./gradlew make --no-daemon --stacktrace
          ./gradlew makePluginsJson --no-daemon || true

      - name: Manifest ve Dizin Olustur
        env:
          REPO_FULL: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          python -c "
          import json, os, glob, shutil

          os.makedirs('public', exist_ok=True)

          # 1. Tum derlenen .cs3 paketlerini derleme agacinda bul ve public dizinine kopyala
          cs3_files = [f for f in glob.glob('**/*.cs3', recursive=True) if not f.startswith('public')]
          for f in cs3_files:
              dest = os.path.join('public', os.path.basename(f))
              try:
                  shutil.copy2(f, dest)
                  print(f'[+] Kopyalandi: {f} -> {dest}')
              except Exception as e:
                  print(f'[-] Kopyalama hatasi ({f}): {e}')

          # 2. Manifest ve URL yapilandirmasi
          repo_full = os.environ.get('REPO_FULL', 'akdrhmz/dev-workspace-tools')
          repo_owner = os.environ.get('REPO_OWNER', 'akdrhmz')
          repo_name = repo_full.split('/')[-1] if '/' in repo_full else 'dev-workspace-tools'
          base_url = f'https://{repo_owner}.github.io/{repo_name}'

          all_cs3 = glob.glob('public/*.cs3')
          plugins = []
          for f in all_cs3:
              name = os.path.basename(f).replace('.cs3', '')
              plugins.append({
                  'name': name,
                  'url': f'{base_url}/{os.path.basename(f)}',
                  'version': 1,
                  'language': 'tr'
              })

          # Eger gradle tarafindan uretilen dolu bir plugins.json varsa al
          gradle_manifest = None
          for candidate in glob.glob('**/plugins.json', recursive=True):
              if not candidate.startswith('public') and os.path.exists(candidate) and os.path.getsize(candidate) > 10:
                  try:
                      with open(candidate, 'r', encoding='utf-8') as gf:
                          content = json.load(gf)
                          if isinstance(content, list) and len(content) > 0:
                              gradle_manifest = content
                              break
                  except Exception:
                      pass

          final_manifest = gradle_manifest if gradle_manifest else plugins

          with open('public/plugins.json', 'w', encoding='utf-8') as mf:
              json.dump(final_manifest, mf, indent=2, ensure_ascii=False)
          print(f'[OK] plugins.json olusturuldu: {len(final_manifest)} eklenti eklendi.')

          repo_meta = {
              'name': 'WatchBuddy TR Providers',
              'description': 'Universal Multi-Source Personal Provider Repository',
              'manifestVersion': 1,
              'pluginLists': [
                  f'{base_url}/plugins.json'
              ]
          }
          with open('public/repo.json', 'w', encoding='utf-8') as rf:
              json.dump(repo_meta, rf, indent=2, ensure_ascii=False)
          print('[OK] repo.json olusturuldu.')
          "

      - name: Dagitim
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
